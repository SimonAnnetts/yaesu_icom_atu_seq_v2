[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7

; Host-side unit tests for the pure logic: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17
build_src_filter = -<*> ; firmware sources need Arduino.h; tests include pure modules directly
