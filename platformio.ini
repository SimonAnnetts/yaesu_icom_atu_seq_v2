[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
; room for a full sequencer log line (~55 chars) alongside the CAT hex log
build_flags = -DSERIAL_TX_BUFFER_SIZE=128
lib_deps =
    bblanchon/ArduinoJson@^7

; Host-side unit tests for the pure logic: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17
; Only the pure (Arduino-free) modules are built for the host.
build_src_filter = -<*> +<sequencer.cpp>
test_build_src = yes
