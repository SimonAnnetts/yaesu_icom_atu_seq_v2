[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
; Applies to every serial port. RX 256 (the AVR maximum for 8-bit indices) so a
; stall in loop() can't overflow the 57600 baud CAT ports; TX 128 so a full
; sequencer log line fits alongside CAT traffic and a CAT forward never blocks.
build_flags =
    -DSERIAL_RX_BUFFER_SIZE=256
    -DSERIAL_TX_BUFFER_SIZE=128
lib_deps =
    bblanchon/ArduinoJson@^7

; Host-side unit tests for the pure logic: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson@^7
; Only the pure (Arduino-free) modules are built for the host.
build_src_filter = -<*> +<sequencer.cpp> +<cat_frame.cpp> +<cat_codec.cpp> +<cat_arbiter.cpp> +<config.cpp> +<config_json.cpp> +<ah4.cpp> +<button.cpp> +<tune.cpp> +<cat_intercept.cpp> +<cat_bridge_core.cpp>
test_build_src = yes
